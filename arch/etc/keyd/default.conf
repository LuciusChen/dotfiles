[ids]

*

[main]

# The ThinkPad Copilot key emits leftmeta+leftshift+f23. Turn that
# synthetic chord into a real right-side Super/Windows modifier.
leftmeta+leftshift+f23 = rightmeta

# Maps capslock to escape when pressed and control when held.
capslock = overload(control, esc)

# Remaps the escape key to capslock
esc = capslock

# Maps z to a custom layer, but just 'z' when pressed.
; = overload(;, ;)

[;]

# Arrows
h = left
j = down
k = up
l = right

y = home
u = end
i = delete
n = pageup
m = pagedown

8 = f8
9 = f9
